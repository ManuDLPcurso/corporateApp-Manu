<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">contacto</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-item>
  <ion-input name='correo' [(ngModel)]="correo" placeholder="Correo"></ion-input>

  <ion-item>
  <ion-textarea name='mensaje' [(ngModel)]="mensaje"></ion-textarea>
          
</ion-item>
<ion-button (click)="enviar()">
  Enviar
</ion-button>
