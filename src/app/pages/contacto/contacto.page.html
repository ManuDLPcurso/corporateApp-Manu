<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">contacto</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-item>
  <ion-input name='correo' [(ngModel)]="correo" placeholder="Correo"></ion-input>

<ion-item>
  <ion-textarea name='mensaje' [(ngModel)]="mensaje" placeholder="Mensaje"></ion-textarea>          
</ion-item>

<br>

<ion-button (click)="enviar()">
  Enviar
</ion-button>

<ion-button (click)="guardar()">
  Guardar
</ion-button>

<ion-button (click)="leer()">
  Leer
</ion-button>

<ion-button (click)="consultar()">
  Consultar
</ion-button>
